# fly.toml app configuration file generated for redin on 2026-10-27T16:03:10Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'redin'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[deploy]
  strategy = 'immediate'
